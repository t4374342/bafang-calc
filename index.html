<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>八方雲集計算</title>
<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#14282b;--mute:#6b7f82;--line:#dbe4e5;--acc:#0f766e;--accInk:#fff;--chip:#e6f0ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1c;--card:#172427;--ink:#e8f1f1;--mute:#8da3a6;--line:#27393c;--acc:#2dd4bf;--accInk:#062421;--chip:#1f3336}}
:root[data-theme="dark"]{--bg:#0f1a1c;--card:#172427;--ink:#e8f1f1;--mute:#8da3a6;--line:#27393c;--acc:#2dd4bf;--accInk:#062421;--chip:#1f3336}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
h1{font-size:20px;margin:0;font-weight:700}
.clear{border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.clear:active{transform:scale(.96)}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.den{font-size:22px;font-weight:700}
.den small{font-size:13px;font-weight:400;color:var(--mute);margin-left:4px}
.sub{text-align:right;font-size:18px;font-variant-numeric:tabular-nums;color:var(--mute)}
.sub b{color:var(--ink);font-weight:600}
.step{grid-column:1/-1;display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.step button{height:52px;border:0;border-radius:12px;background:var(--chip);color:var(--acc);font-size:26px;font-weight:600;cursor:pointer}
.step button:active{transform:scale(.95)}
.step input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:24px;font-weight:600;text-align:center;min-width:0}
.step input:focus,.step button:focus-visible,.clear:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.total{margin-top:18px;background:var(--acc);color:var(--accInk);border-radius:20px;padding:20px}
.total .line{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;opacity:.9}
.total .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.total .big span:first-child{font-size:16px}
.total .big span:last-child{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
</style>
</head>
<body>
<main>
<header><h1>八方雲集計算</h1><button class="clear" id="clear" type="button">清除</button></header>
<div id="rows"></div>
<section class="total" aria-live="polite">
<div class="line"><span>總張數</span><span id="cnt">0 張</span></div>
<div class="big"><span>總金額</span><span id="sum">$0</span></div>
</section>
</main>
<script>
var DENS=[1000,500,100];
var rows=document.getElementById('rows'),inputs=[],subs=[];
function fmt(n){return n.toLocaleString('en-US')}
DENS.forEach(function(d,i){
  var el=document.createElement('div');el.className='row';
  el.innerHTML='<div class="den">'+fmt(d)+'<small>元</small></div><div class="sub">小計 <b>$0</b></div>'+
  '<div class="step"><button type="button" aria-label="減少">−</button><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" aria-label="'+d+' 元張數"><button type="button" aria-label="增加">+</button></div>';
  rows.appendChild(el);
  var inp=el.querySelector('input'),b=el.querySelectorAll('button');
  inputs.push(inp);subs.push(el.querySelector('.sub b'));
  b[0].onclick=function(){inp.value=Math.max(0,val(i)-1)||'';calc()};
  b[1].onclick=function(){inp.value=val(i)+1;calc()};
  inp.oninput=function(){inp.value=inp.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');calc()};
  inp.onfocus=function(){inp.select()};
});
function val(i){return parseInt(inputs[i].value,10)||0}
function calc(){
  var c=0,s=0;
  DENS.forEach(function(d,i){var n=val(i);c+=n;s+=n*d;subs[i].textContent='$'+fmt(n*d)});
  document.getElementById('cnt').textContent=fmt(c)+' 張';
  document.getElementById('sum').textContent='$'+fmt(s);
}
document.getElementById('clear').onclick=function(){inputs.forEach(function(x){x.value=''});calc()};
calc();
</script>
</body>
</html>
